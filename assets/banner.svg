<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Gunda Tejeswara Rao — Full-Stack Developer</title>
  <desc id="desc">A dark futuristic developer banner featuring full-stack development, AI systems, cloud, and cybersecurity.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B17"/>
      <stop offset="0.52" stop-color="#111936"/>
      <stop offset="1" stop-color="#090D1C"/>
    </linearGradient>
    <linearGradient id="headline" x1="60" y1="125" x2="610" y2="125" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#B8C7E8"/>
    </linearGradient>
    <linearGradient id="accent" x1="60" y1="0" x2="615" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="ring" x1="1010" y1="65" x2="1135" y2="255" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.48" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 90) rotate(90) scale(190)">
      <stop stop-color="#2563EB" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(140 285) rotate(90) scale(170)">
      <stop stop-color="#9333EA" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#9333EA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity="0.08"/>
    </pattern>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#background)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <circle cx="1050" cy="90" r="190" fill="url(#blueGlow)" filter="url(#softBlur)"/>
  <circle cx="140" cy="285" r="170" fill="url(#purpleGlow)" filter="url(#softBlur)"/>

  <!-- subtle orbital paths -->
  <g opacity="0.28" stroke="#64748B" fill="none">
    <ellipse cx="1060" cy="160" rx="205" ry="92" transform="rotate(-22 1060 160)"/>
    <ellipse cx="1060" cy="160" rx="238" ry="112" transform="rotate(-22 1060 160)"/>
  </g>

  <!-- left content -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="62" y="72" fill="#7DD3FC" font-size="15" font-weight="700" letter-spacing="3">HELLO, WORLD  /  BUILDING IN PUBLIC</text>
    <text x="60" y="132" fill="url(#headline)" font-size="50" font-weight="800">Gunda Tejeswara Rao</text>
    <rect x="62" y="151" width="410" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="62" y="193" fill="#D7E2F5" font-size="21" font-weight="600">Full-Stack Developer · AI Builder</text>
    <text x="62" y="222" fill="#91A4C5" font-size="16">Cloud • Cybersecurity • IoT • Agentic Systems</text>

    <!-- skill pills -->
    <g font-family="Fira Code, Consolas, monospace" font-size="13" font-weight="600">
      <rect x="62" y="253" width="92" height="32" rx="16" fill="#102A43" stroke="#38BDF8" stroke-opacity="0.7"/>
      <text x="108" y="274" text-anchor="middle" fill="#7DD3FC">Python</text>
      <rect x="164" y="253" width="116" height="32" rx="16" fill="#21143D" stroke="#A855F7" stroke-opacity="0.7"/>
      <text x="222" y="274" text-anchor="middle" fill="#D8B4FE">Full-Stack</text>
      <rect x="290" y="253" width="104" height="32" rx="16" fill="#102F30" stroke="#2DD4BF" stroke-opacity="0.7"/>
      <text x="342" y="274" text-anchor="middle" fill="#99F6E4">AWS Cloud</text>
      <rect x="404" y="253" width="102" height="32" rx="16" fill="#35172A" stroke="#F472B6" stroke-opacity="0.7"/>
      <text x="455" y="274" text-anchor="middle" fill="#FBCFE8">AI Agents</text>
    </g>
  </g>

  <!-- right code card -->
  <g filter="url(#shadow)">
    <rect x="725" y="60" width="330" height="196" rx="16" fill="#0B1225" fill-opacity="0.92" stroke="#33456E"/>
    <rect x="725" y="60" width="330" height="38" rx="16" fill="#111C35"/>
    <rect x="725" y="82" width="330" height="16" fill="#111C35"/>
    <circle cx="749" cy="79" r="5" fill="#FB7185"/>
    <circle cx="766" cy="79" r="5" fill="#FACC15"/>
    <circle cx="783" cy="79" r="5" fill="#4ADE80"/>
    <text x="818" y="84" fill="#7185AA" font-family="Fira Code, Consolas, monospace" font-size="12">developer.ts</text>
    <g font-family="Fira Code, Consolas, monospace" font-size="14">
      <text x="750" y="129" fill="#A78BFA">const</text>
      <text x="796" y="129" fill="#E2E8F0">builder</text>
      <text x="856" y="129" fill="#64748B">=</text>
      <text x="870" y="129" fill="#7DD3FC">{</text>
      <text x="773" y="154" fill="#94A3B8">focus:</text>
      <text x="837" y="154" fill="#86EFAC">"impact"</text>
      <text x="773" y="179" fill="#94A3B8">status:</text>
      <text x="837" y="179" fill="#FCD34D">"always_learning"</text>
      <text x="750" y="204" fill="#7DD3FC">}</text>
      <text x="750" y="232" fill="#64748B">// turn ideas into reality</text>
    </g>
  </g>

  <!-- monogram -->
  <g>
    <circle cx="1100" cy="160" r="72" fill="#0B1225" stroke="url(#ring)" stroke-width="3" stroke-dasharray="12 8"/>
    <circle cx="1100" cy="160" r="57" fill="#111A32" stroke="#3B4D77"/>
    <text x="1100" y="174" text-anchor="middle" fill="url(#accent)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="800">GT</text>
    <circle cx="1157" cy="103" r="5" fill="#38BDF8"/>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="18" stroke="#334155" stroke-opacity="0.5"/>
</svg>
