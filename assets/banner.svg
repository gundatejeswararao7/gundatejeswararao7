<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#131b3a"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF">
        <animate attributeName="stop-color" values="#58A6FF;#7C3AED;#58A6FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#58A6FF;#7C3AED" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>

    <radialGradient id="glow" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.5"/>

  <!-- pulsing ambient glow -->
  <rect width="1200" height="300" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- circuit-style decorative lines, right side, drawing themselves in -->
  <g stroke="#2d3a5a" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 900 260 L 960 260 L 980 240 L 1040 240" stroke-dasharray="140" stroke-dashoffset="140">
      <animate attributeName="stroke-dashoffset" from="140" to="0" dur="1.6s" begin="0.2s" fill="freeze"/>
    </path>
    <circle cx="900" cy="260" r="4" fill="#58A6FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="240" r="4" fill="#7C3AED">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>

    <path d="M 950 60 L 1000 60 L 1020 80 L 1100 80" stroke-dasharray="160" stroke-dashoffset="160">
      <animate attributeName="stroke-dashoffset" from="160" to="0" dur="1.6s" begin="0.5s" fill="freeze"/>
    </path>
    <circle cx="950" cy="60" r="4" fill="#7C3AED">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="80" r="4" fill="#58A6FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="1.1s" repeatCount="indefinite"/>
    </circle>

    <path d="M 1080 150 L 1140 150 L 1155 165" stroke-dasharray="90" stroke-dashoffset="90">
      <animate attributeName="stroke-dashoffset" from="90" to="0" dur="1.2s" begin="0.8s" fill="freeze"/>
    </path>
    <circle cx="1080" cy="150" r="4" fill="#58A6FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1155" cy="165" r="4" fill="#7C3AED">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="1.4s" repeatCount="indefinite"/>
    </circle>

    <path d="M 850 30 L 890 30 L 905 45 L 950 45" stroke-dasharray="110" stroke-dashoffset="110">
      <animate attributeName="stroke-dashoffset" from="110" to="0" dur="1.2s" begin="1s" fill="freeze"/>
    </path>
    <circle cx="850" cy="30" r="3" fill="#58A6FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- angle bracket motif, fades + slides in -->
  <text x="60" y="120" font-family="Fira Code, Consolas, monospace" font-size="42" fill="url(#accent)" font-weight="700" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-20 0" to="0 0" dur="0.8s" begin="0.1s" fill="freeze"/>
    &lt;/&gt;
  </text>

  <!-- name, fades + slides in -->
  <text x="60" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" fill="#e6edf3" font-weight="700" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-30 0" to="0 0" dur="0.9s" begin="0.35s" fill="freeze"/>
    Gunda Tejeswara Rao
  </text>

  <!-- accent underline, grows from left -->
  <rect x="62" y="190" width="0" height="5" rx="2.5" fill="url(#accent)">
    <animate attributeName="width" from="0" to="360" dur="0.9s" begin="0.9s" fill="freeze"/>
  </rect>

  <!-- tagline, fades in -->
  <text x="62" y="230" font-family="Fira Code, Consolas, monospace" font-size="20" fill="#8b949e" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.1s" fill="freeze"/>
    Full-Stack Developer · AI &amp; Agentic Systems · Cloud &amp; Security
    <animate attributeName="fill" values="#8b949e;#aab4c2;#8b949e" dur="5s" begin="2s" repeatCount="indefinite"/>
  </text>

  <!-- small tag pills, pop in one by one -->
  <g font-family="Fira Code, Consolas, monospace" font-size="14" font-weight="600">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.4s" fill="freeze"/>
      <rect x="62" y="250" width="70" height="26" rx="13" fill="#1c2333" stroke="#30363d"/>
      <text x="97" y="267" fill="#58A6FF" text-anchor="middle">Python</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.4s" fill="freeze"/>
      <rect x="62" y="250" width="70" height="26" rx="13" fill="#1c2333" stroke="#30363d"/>
      <text x="97" y="267" fill="#58A6FF" text-anchor="middle">React</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.55s" fill="freeze"/>
      <rect x="142" y="250" width="82" height="26" rx="13" fill="#1c2333" stroke="#30363d"/>
      <text x="183" y="267" fill="#7C3AED" text-anchor="middle">FastAPI</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.7s" fill="freeze"/>
      <rect x="234" y="250" width="66" height="26" rx="13" fill="#1c2333" stroke="#30363d"/>
      <text x="267" y="267" fill="#58A6FF" text-anchor="middle">AWS</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.85s" fill="freeze"/>
      <rect x="310" y="250" width="60" height="26" rx="13" fill="#1c2333" stroke="#30363d"/>
      <text x="340" y="267" fill="#7C3AED" text-anchor="middle">IoT</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2s" fill="freeze"/>
      <rect x="380" y="250" width="110" height="26" rx="13" fill="#1c2333" stroke="#30363d"/>
      <text x="435" y="267" fill="#58A6FF" text-anchor="middle">Cybersecurity</text>
    </g>
  </g>

  <!-- right-side monogram, rotating ring + fade-in circle -->
  <g>
    <circle cx="1080" cy="150" r="70" fill="none" stroke="url(#accent2)" stroke-width="3" opacity="0.6" stroke-dasharray="18 12">
      <animateTransform attributeName="transform" type="rotate" from="0 1080 150" to="360 1080 150" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="150" r="52" fill="#161b22" stroke="#30363d" stroke-width="2" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.6s" fill="freeze"/>
    </circle>
    <text x="1080" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="url(#accent)" text-anchor="middle" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.8s" fill="freeze"/>
      GT
    </text>
  </g>
</svg>
