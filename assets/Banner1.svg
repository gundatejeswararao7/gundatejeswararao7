<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0d1224"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9d6ea"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#A855F7;#F472B6;#38BDF8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#F472B6;#38BDF8;#A855F7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#F472B6">
        <animate attributeName="stop-color" values="#F472B6;#38BDF8;#A855F7;#F472B6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="33%" stop-color="#A855F7"/>
      <stop offset="66%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#1b2333" stroke-width="1"/>
    </pattern>

    <filter id="blurBlob" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <radialGradient id="blobBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- floating aurora blobs -->
  <g filter="url(#blurBlob)">
    <circle cx="980" cy="70" r="130" fill="url(#blobBlue)">
      <animate attributeName="cx" values="980;1020;980" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="220" r="150" fill="url(#blobPurple)">
      <animate attributeName="cy" values="220;180;220" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="260" r="140" fill="url(#blobPink)">
      <animate attributeName="cx" values="150;190;150" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="40" r="110" fill="url(#blobTeal)">
      <animate attributeName="cy" values="40;70;40" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect width="1200" height="300" fill="url(#grid)" opacity="0.35"/>

  <!-- fine constellation dots -->
  <g fill="#8fa3c9">
    <circle cx="700" cy="40" r="2" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="90" r="1.6" opacity="0.4"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="55" r="2" opacity="0.5"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="200" r="1.8" opacity="0.4"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="250" r="2" opacity="0.4"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- circuit-style decorative lines, right side, drawing themselves in -->
  <g stroke="#3a4766" stroke-width="2" fill="none" opacity="0.9">
    <path d="M 900 262 L 958 262 L 978 242 L 1036 242" stroke-dasharray="140" stroke-dashoffset="140">
      <animate attributeName="stroke-dashoffset" from="140" to="0" dur="1.6s" begin="0.2s" fill="freeze"/>
    </path>
    <circle cx="900" cy="262" r="4" fill="#38BDF8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1036" cy="242" r="4" fill="#A855F7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="0.5s" repeatCount="indefinite"/></circle>

    <path d="M 950 55 L 998 55 L 1018 75 L 1096 75" stroke-dasharray="160" stroke-dashoffset="160">
      <animate attributeName="stroke-dashoffset" from="160" to="0" dur="1.6s" begin="0.5s" fill="freeze"/>
    </path>
    <circle cx="950" cy="55" r="4" fill="#F472B6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="1096" cy="75" r="4" fill="#FACC15"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- angle bracket motif, fades + slides in -->
  <text x="60" y="118" font-family="Fira Code, Consolas, monospace" font-size="40" fill="url(#accent)" font-weight="700" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-20 0" to="0 0" dur="0.8s" begin="0.1s" fill="freeze"/>
    &lt;/&gt;
  </text>

  <!-- name, fades + slides in -->
  <text x="60" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" fill="url(#titleGrad)" font-weight="800" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-30 0" to="0 0" dur="0.9s" begin="0.35s" fill="freeze"/>
    Gunda Tejeswara Rao
  </text>

  <!-- accent underline, grows from left -->
  <rect x="62" y="189" width="0" height="5" rx="2.5" fill="url(#accent)">
    <animate attributeName="width" from="0" to="360" dur="0.9s" begin="0.9s" fill="freeze"/>
  </rect>

  <!-- tagline, fades in -->
  <text x="62" y="228" font-family="Fira Code, Consolas, monospace" font-size="19" fill="#a8b6d1" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.1s" fill="freeze"/>
    Full-Stack Developer · AI &amp; Agentic Systems · Cloud &amp; Security
  </text>

  <!-- colorful skill pills, pop in one by one -->
  <g font-family="Fira Code, Consolas, monospace" font-size="14" font-weight="600">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.4s" fill="freeze"/>
      <rect x="62" y="248" width="82" height="27" rx="13.5" fill="#132233" stroke="#3B82F6" stroke-width="1.2"/>
      <text x="103" y="266" fill="#7DB6FF" text-anchor="middle">Python</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.55s" fill="freeze"/>
      <rect x="156" y="248" width="114" height="27" rx="13.5" fill="#241a33" stroke="#A855F7" stroke-width="1.2"/>
      <text x="213" y="266" fill="#D4A6FF" text-anchor="middle">Full-Stack</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.7s" fill="freeze"/>
      <rect x="282" y="248" width="120" height="27" rx="13.5" fill="#0f2b2a" stroke="#2DD4BF" stroke-width="1.2"/>
      <text x="342" y="266" fill="#7DEBDD" text-anchor="middle">Networking</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.85s" fill="freeze"/>
      <rect x="414" y="248" width="114" height="27" rx="13.5" fill="#332312" stroke="#FB923C" stroke-width="1.2"/>
      <text x="471" y="266" fill="#FFC08A" text-anchor="middle">AWS Cloud</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2s" fill="freeze"/>
      <rect x="540" y="248" width="110" height="27" rx="13.5" fill="#331a28" stroke="#F472B6" stroke-width="1.2"/>
      <text x="595" y="266" fill="#FFA6CE" text-anchor="middle">AI Agents</text>
    </g>
  </g>

  <!-- right-side monogram, rotating multi-color ring + fade-in circle -->
  <g>
    <circle cx="1080" cy="150" r="72" fill="none" stroke="url(#ringGrad)" stroke-width="3.5" opacity="0.85" stroke-dasharray="16 11">
      <animateTransform attributeName="transform" type="rotate" from="0 1080 150" to="360 1080 150" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="150" r="53" fill="#101526" stroke="#2a3450" stroke-width="2" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.6s" fill="freeze"/>
    </circle>
    <text x="1080" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#accent)" text-anchor="middle" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.8s" fill="freeze"/>
      GT
    </text>
  </g>
</svg>
