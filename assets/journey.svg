<svg
  width="100%"
  viewBox="0 0 680 676"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>

  <title id="title">Animated Developer Journey</title>

  <desc id="desc">
    Animated developer journey from full-stack development through
    React, Python FastAPI, Node.js, Cloud and DevOps, Intelligent systems,
    Connected systems and Secure engineering.
  </desc>

  <defs>

    <!-- Arrow head -->
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="6"
      markerHeight="6"
      orient="auto"
    >
      <path
        d="M2 1 L8 5 L2 9"
        fill="none"
        stroke="context-stroke"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </marker>

    <!-- Common animation -->
    <style>

      .box {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: boxIn 0.7s ease forwards;
      }

      .arrow {
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-dasharray: 5 6;

        opacity: 0;

        animation:
          arrowIn 0.8s ease forwards,
          dashMove 1.2s linear infinite;
      }

      .label {
        opacity: 0;
        animation: labelIn 0.5s ease forwards;
      }

      @keyframes boxIn {
        0% {
          opacity: 0;
          transform: scale(0.75) translateY(10px);
        }

        70% {
          opacity: 1;
          transform: scale(1.04) translateY(0);
        }

        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @keyframes labelIn {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes arrowIn {
        from {
          opacity: 0;
          stroke-dashoffset: 80;
        }

        to {
          opacity: 1;
          stroke-dashoffset: 0;
        }
      }

      @keyframes dashMove {
        to {
          stroke-dashoffset: -22;
        }
      }

      /*
       * Animation sequence
       */

      #box-start {
        animation-delay: 0.2s;
      }

      #arrow-top {
        animation-delay: 0.9s;
      }

      #frontend {
        animation-delay: 1.5s;
      }

      #backend {
        animation-delay: 1.7s;
      }

      #node {
        animation-delay: 1.9s;
      }

      #arrow-cloud {
        animation-delay: 2.6s;
      }

      #cloud {
        animation-delay: 3.2s;
      }

      #arrow-ai {
        animation-delay: 4.0s;
      }

      #ai {
        animation-delay: 4.6s;
      }

      #arrow-iot {
        animation-delay: 5.4s;
      }

      #iot {
        animation-delay: 6.0s;
      }

      #arrow-security {
        animation-delay: 6.8s;
      }

      #security {
        animation-delay: 7.4s;
      }

      /*
       * Text inside boxes
       */

      .title {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        font-size: 14px;
        font-weight: 500;

        text-anchor: middle;
        dominant-baseline: central;
      }

      .subtitle {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        font-size: 12px;
        font-weight: 400;

        text-anchor: middle;
        dominant-baseline: central;
      }

      .small-label {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        font-size: 12px;
        fill: #52514e;
      }

    </style>

  </defs>


  <!-- ========================================================= -->
  <!-- 1. FULL STACK DEVELOPMENT -->
  <!-- ========================================================= -->

  <g id="box-start" class="box">

    <rect
      x="230"
      y="20"
      width="220"
      height="56"
      rx="8"
      fill="#e6f1fb"
      stroke="#185fa5"
      stroke-width="0.8"
    />

    <text
      x="340"
      y="39"
      class="title"
      fill="#0c447c"
    >
      Full-stack development
    </text>

    <text
      x="340"
      y="58"
      class="subtitle"
      fill="#185fa5"
    >
      Where every product starts
    </text>

  </g>


  <!-- ========================================================= -->
  <!-- 2. TOP ARROWS -->
  <!-- ========================================================= -->

  <g
    id="arrow-top"
    class="arrow"
    stroke="#378add"
  >

    <path
      d="M340 80
         C340 108 125 100 125 126"
      marker-end="url(#arrow)"
    />

    <path
      d="M340 80
         L340 126"
      marker-end="url(#arrow)"
    />

    <path
      d="M340 80
         C340 108 555 100 555 126"
      marker-end="url(#arrow)"
    />

  </g>


  <!-- ========================================================= -->
  <!-- 3. FRONTEND / BACKEND BRANCHES -->
  <!-- ========================================================= -->

  <g id="frontend" class="box">

    <rect
      x="40"
      y="130"
      width="170"
      height="56"
      rx="8"
      fill="#e6f1fb"
      stroke="#185fa5"
      stroke-width="0.8"
    />

    <text
      x="125"
      y="149"
      class="title"
      fill="#0c447c"
    >
      React
    </text>

    <text
      x="125"
      y="168"
      class="subtitle"
      fill="#185fa5"
    >
      Frontend interfaces
    </text>

  </g>


  <g id="backend" class="box">

    <rect
      x="255"
      y="130"
      width="170"
      height="56"
      rx="8"
      fill="#e6f1fb"
      stroke="#185fa5"
      stroke-width="0.8"
    />

    <text
      x="340"
      y="149"
      class="title"
      fill="#0c447c"
    >
      Python · FastAPI
    </text>

    <text
      x="340"
      y="168"
      class="subtitle"
      fill="#185fa5"
    >
      APIs and services
    </text>

  </g>


  <g id="node" class="box">

    <rect
      x="470"
      y="130"
      width="170"
      height="56"
      rx="8"
      fill="#e6f1fb"
      stroke="#185fa5"
      stroke-width="0.8"
    />

    <text
      x="555"
      y="149"
      class="title"
      fill="#0c447c"
    >
      Node.js
    </text>

    <text
      x="555"
      y="168"
      class="subtitle"
      fill="#185fa5"
    >
      Real-time backends
    </text>

  </g>


  <!-- ========================================================= -->
  <!-- 4. ARROWS → CLOUD -->
  <!-- ========================================================= -->

  <g
    id="arrow-cloud"
    class="arrow"
    stroke="#ba7517"
  >

    <path
      d="M125 190
         C125 225 340 215 340 252"
      marker-end="url(#arrow)"
    />

    <path
      d="M340 190
         L340 252"
      marker-end="url(#arrow)"
    />

    <path
      d="M555 190
         C555 225 340 215 340 252"
      marker-end="url(#arrow)"
    />

  </g>


  <!-- ========================================================= -->
  <!-- 5. CLOUD & DEVOPS -->
  <!-- ========================================================= -->

  <g id="cloud" class="box">

    <rect
      x="220"
      y="256"
      width="240"
      height="56"
      rx="8"
      fill="#faeeda"
      stroke="#854f0b"
      stroke-width="0.8"
    />

    <text
      x="340"
      y="275"
      class="title"
      fill="#633806"
    >
      Cloud and DevOps
    </text>

    <text
      x="340"
      y="294"
      class="subtitle"
      fill="#854f0b"
    >
      AWS · Docker · Linux
    </text>

  </g>


  <!-- ========================================================= -->
  <!-- 6. CLOUD → AI -->
  <!-- ========================================================= -->

  <path
    id="arrow-ai"
    class="arrow"
    d="M340 316 L340 360"
    stroke="#7f77dd"
    marker-end="url(#arrow)"
  />

  <text
    x="358"
    y="342"
    class="small-label label"
    style="animation-delay:4.0s"
  >
    add intelligence
  </text>


  <!-- ========================================================= -->
  <!-- 7. INTELLIGENT SYSTEMS -->
  <!-- ========================================================= -->

  <g id="ai" class="box">

    <rect
      x="220"
      y="364"
      width="240"
      height="56"
      rx="8"
      fill="#eeedfe"
      stroke="#534ab7"
      stroke-width="0.8"
    />

    <text
      x="340"
      y="383"
      class="title"
      fill="#3c3489"
    >
      Intelligent systems
    </text>

    <text
      x="340"
      y="402"
      class="subtitle"
      fill="#534ab7"
    >
      AI · Agentic AI · Automation
    </text>

  </g>


  <!-- ========================================================= -->
  <!-- 8. AI → IOT -->
  <!-- ========================================================= -->

  <path
    id="arrow-iot"
    class="arrow"
    d="M340 424 L340 468"
    stroke="#1d9e75"
    marker-end="url(#arrow)"
  />

  <text
    x="358"
    y="450"
    class="small-label label"
    style="animation-delay:5.4s"
  >
    reach the physical world
  </text>


  <!-- ========================================================= -->
  <!-- 9. CONNECTED SYSTEMS -->
  <!-- ========================================================= -->

  <g id="iot" class="box">

    <rect
      x="220"
      y="472"
      width="240"
      height="56"
      rx="8"
      fill="#e1f5ee"
      stroke="#0f6e56"
      stroke-width="0.8"
    />

    <text
      x="340"
      y="491"
      class="title"
      fill="#085041"
    >
      Connected systems
    </text>

    <text
      x="340"
      y="510"
      class="subtitle"
      fill="#0f6e56"
    >
      IoT · ESP32 · Embedded
    </text>

  </g>


  <!-- ========================================================= -->
  <!-- 10. IOT → SECURITY -->
  <!-- ========================================================= -->

  <path
    id="arrow-security"
    class="arrow"
    d="M340 532 L340 576"
    stroke="#d4537e"
    marker-end="url(#arrow)"
  />

  <text
    x="358"
    y="558"
    class="small-label label"
    style="animation-delay:6.8s"
  >
    protect it all
  </text>


  <!-- ========================================================= -->
  <!-- 11. SECURITY -->
  <!-- ========================================================= -->

  <g id="security" class="box">

    <rect
      x="220"
      y="580"
      width="240"
      height="56"
      rx="8"
      fill="#fbeaf0"
      stroke="#993556"
      stroke-width="0.8"
    />

    <text
      x="340"
      y="599"
      class="title"
      fill="#72243e"
    >
      Secure engineering
    </text>

    <text
      x="340"
      y="618"
      class="subtitle"
      fill="#993556"
    >
      Cybersecurity
    </text>

  </g>

</svg>
