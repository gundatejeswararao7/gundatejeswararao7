<svg width="1000" height="1140" viewBox="0 0 1000 1140" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0d1224"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b2333" stroke-width="1"/>
    </pattern>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9db4ff"/>
    </marker>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1000" height="1140" fill="url(#bg)"/>
  <rect width="1000" height="1140" fill="url(#grid)" opacity="0.4"/>

  <!-- ================= CONNECTORS ================= -->
  <g fill="none" stroke="url(#lineGrad)" stroke-width="3" opacity="0.9">
    <!-- root -> three branches -->
    <path d="M500,130 C500,168 175,172 175,208" stroke-dasharray="260" stroke-dashoffset="260" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="260" to="0" dur="1.2s" begin="0.2s" fill="freeze"/>
    </path>
    <path d="M500,130 C500,160 500,180 500,208" stroke-dasharray="90" stroke-dashoffset="90" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="90" to="0" dur="0.8s" begin="0.3s" fill="freeze"/>
    </path>
    <path d="M500,130 C500,168 825,172 825,208" stroke-dasharray="260" stroke-dashoffset="260" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="260" to="0" dur="1.2s" begin="0.2s" fill="freeze"/>
    </path>

    <!-- three branches -> merge point -->
    <path d="M175,320 C175,362 460,384 494,398" stroke-dasharray="240" stroke-dashoffset="240">
      <animate attributeName="stroke-dashoffset" from="240" to="0" dur="1s" begin="1s" fill="freeze"/>
    </path>
    <path d="M500,320 C500,350 500,372 500,394" stroke-dasharray="90" stroke-dashoffset="90">
      <animate attributeName="stroke-dashoffset" from="90" to="0" dur="0.7s" begin="1.1s" fill="freeze"/>
    </path>
    <path d="M825,320 C825,362 540,384 506,398" stroke-dasharray="240" stroke-dashoffset="240">
      <animate attributeName="stroke-dashoffset" from="240" to="0" dur="1s" begin="1s" fill="freeze"/>
    </path>

    <!-- merge -> cloud -->
    <path d="M500,406 L500,438" stroke-dasharray="40" stroke-dashoffset="40" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="40" to="0" dur="0.5s" begin="1.6s" fill="freeze"/>
    </path>

    <!-- cloud -> intelligent -->
    <path d="M500,570 L500,618" stroke-dasharray="56" stroke-dashoffset="56" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="56" to="0" dur="0.5s" begin="2s" fill="freeze"/>
    </path>

    <!-- intelligent -> connected -->
    <path d="M500,750 L500,798" stroke-dasharray="56" stroke-dashoffset="56" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="56" to="0" dur="0.5s" begin="2.4s" fill="freeze"/>
    </path>

    <!-- connected -> secure -->
    <path d="M500,930 L500,978" stroke-dasharray="56" stroke-dashoffset="56" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="56" to="0" dur="0.5s" begin="2.8s" fill="freeze"/>
    </path>
  </g>

  <!-- merge point dot -->
  <circle cx="500" cy="400" r="6" fill="#c9b8ff" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.5s" fill="freeze"/>
    <animate attributeName="r" values="6;9;6" dur="2.4s" begin="1.9s" repeatCount="indefinite"/>
  </circle>

  <!-- ================= ROOT CARD ================= -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0s" fill="freeze"/>
    <rect x="350" y="40" width="300" height="90" rx="18" fill="#101528" stroke="#3B82F6" stroke-width="2"/>
    <text x="382" y="80" font-size="30" text-anchor="middle">💻</text>
    <text x="500" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#e8edf9" text-anchor="middle">Full-Stack Development</text>
    <text x="500" y="100" font-family="Fira Code, Consolas, monospace" font-size="12" fill="#7d8bab" text-anchor="middle">where every product starts</text>
  </g>

  <!-- ================= THREE BRANCH CARDS ================= -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.9s" fill="freeze"/>
      <rect x="60" y="210" width="230" height="110" rx="16" fill="#0f1626" stroke="#38BDF8" stroke-width="1.6"/>
      <text x="175" y="248" font-size="26" text-anchor="middle">⚛️</text>
      <text x="175" y="278" font-size="16" font-weight="700" fill="#dce6ff" text-anchor="middle">React</text>
      <text x="175" y="298" font-family="Fira Code, monospace" font-size="11" fill="#7d8bab" text-anchor="middle">frontend interfaces</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1s" fill="freeze"/>
      <rect x="385" y="210" width="230" height="110" rx="16" fill="#0f1626" stroke="#38BDF8" stroke-width="1.6"/>
      <text x="465" y="248" font-size="26" text-anchor="middle">🐍</text>
      <text x="500" y="278" font-size="16" font-weight="700" fill="#dce6ff" text-anchor="middle">Python · FastAPI</text>
      <text x="500" y="298" font-family="Fira Code, monospace" font-size="11" fill="#7d8bab" text-anchor="middle">APIs &amp; services</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.9s" fill="freeze"/>
      <rect x="710" y="210" width="230" height="110" rx="16" fill="#0f1626" stroke="#38BDF8" stroke-width="1.6"/>
      <text x="795" y="248" font-size="26" text-anchor="middle">🟢</text>
      <text x="825" y="278" font-size="16" font-weight="700" fill="#dce6ff" text-anchor="middle">Node.js</text>
      <text x="825" y="298" font-family="Fira Code, monospace" font-size="11" fill="#7d8bab" text-anchor="middle">real-time backends</text>
    </g>
  </g>

  <!-- ================= CLOUD & DEVOPS ================= -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.8s" fill="freeze"/>
    <rect x="290" y="440" width="420" height="130" rx="20" fill="#151109" stroke="#FB923C" stroke-width="2"/>
    <text x="330" y="495" font-size="32" text-anchor="middle">☁️</text>
    <text x="500" y="484" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffe4c9" text-anchor="middle">Cloud &amp; DevOps</text>
    <text x="500" y="508" font-family="Fira Code, monospace" font-size="12" fill="#c9a67c" text-anchor="middle">shipping and running things reliably</text>

    <g font-family="Fira Code, monospace" font-size="13" font-weight="600">
      <rect x="345" y="522" width="76" height="26" rx="13" fill="#241a0c" stroke="#FB923C" stroke-width="1"/>
      <text x="383" y="539" fill="#FFC08A" text-anchor="middle">☁️ AWS</text>
      <rect x="429" y="522" width="86" height="26" rx="13" fill="#241a0c" stroke="#FB923C" stroke-width="1"/>
      <text x="472" y="539" fill="#FFC08A" text-anchor="middle">🐳 Docker</text>
      <rect x="523" y="522" width="82" height="26" rx="13" fill="#241a0c" stroke="#FB923C" stroke-width="1"/>
      <text x="564" y="539" fill="#FFC08A" text-anchor="middle">🐧 Linux</text>
    </g>
  </g>

  <!-- ================= INTELLIGENT SYSTEMS ================= -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.2s" fill="freeze"/>
    <rect x="270" y="620" width="460" height="130" rx="20" fill="#150f1f" stroke="#A855F7" stroke-width="2"/>
    <text x="312" y="675" font-size="32" text-anchor="middle">🤖</text>
    <text x="500" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#eaddff" text-anchor="middle">Intelligent Systems</text>
    <text x="500" y="688" font-family="Fira Code, monospace" font-size="12" fill="#b79ce0" text-anchor="middle">teaching software to decide and act</text>

    <g font-family="Fira Code, monospace" font-size="13" font-weight="600">
      <rect x="330" y="702" width="56" height="26" rx="13" fill="#1e1330" stroke="#A855F7" stroke-width="1"/>
      <text x="358" y="719" fill="#D4A6FF" text-anchor="middle">AI</text>
      <rect x="394" y="702" width="112" height="26" rx="13" fill="#1e1330" stroke="#A855F7" stroke-width="1"/>
      <text x="450" y="719" fill="#D4A6FF" text-anchor="middle">🧩 Agentic AI</text>
      <rect x="514" y="702" width="128" height="26" rx="13" fill="#1e1330" stroke="#A855F7" stroke-width="1"/>
      <text x="578" y="719" fill="#D4A6FF" text-anchor="middle">⚙️ Automation</text>
    </g>
  </g>

  <!-- ================= CONNECTED SYSTEMS ================= -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.6s" fill="freeze"/>
    <rect x="270" y="800" width="460" height="130" rx="20" fill="#0b1a1c" stroke="#2DD4BF" stroke-width="2"/>
    <text x="312" y="855" font-size="32" text-anchor="middle">📡</text>
    <text x="500" y="844" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#d3fff7" text-anchor="middle">Connected Systems</text>
    <text x="500" y="868" font-family="Fira Code, monospace" font-size="12" fill="#7fd9cc" text-anchor="middle">bridging software and the physical world</text>

    <g font-family="Fira Code, monospace" font-size="13" font-weight="600">
      <rect x="336" y="882" width="66" height="26" rx="13" fill="#0e2624" stroke="#2DD4BF" stroke-width="1"/>
      <text x="369" y="899" fill="#7DEBDD" text-anchor="middle">IoT</text>
      <rect x="410" y="882" width="92" height="26" rx="13" fill="#0e2624" stroke="#2DD4BF" stroke-width="1"/>
      <text x="456" y="899" fill="#7DEBDD" text-anchor="middle">🔧 ESP32</text>
      <rect x="510" y="882" width="118" height="26" rx="13" fill="#0e2624" stroke="#2DD4BF" stroke-width="1"/>
      <text x="569" y="899" fill="#7DEBDD" text-anchor="middle">🔌 Embedded</text>
    </g>
  </g>

  <!-- ================= SECURE ENGINEERING ================= -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3s" fill="freeze"/>
    <rect x="300" y="980" width="400" height="120" rx="20" fill="#1c0f16" stroke="#F472B6" stroke-width="2"/>
    <text x="340" y="1032" font-size="32" text-anchor="middle">🛡️</text>
    <text x="500" y="1022" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffd9ea" text-anchor="middle">Secure Engineering</text>
    <text x="500" y="1046" font-family="Fira Code, monospace" font-size="12" fill="#e29dbb" text-anchor="middle">protecting what gets built</text>

    <g font-family="Fira Code, monospace" font-size="13" font-weight="600">
      <rect x="420" y="1060" width="160" height="26" rx="13" fill="#2a1520" stroke="#F472B6" stroke-width="1"/>
      <text x="500" y="1077" fill="#FFA6CE" text-anchor="middle">🔐 Cybersecurity</text>
    </g>
  </g>
</svg>
